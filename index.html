<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordénate</title>
<meta name="description" content="Tu agenda de bolsillo: escribe tus exámenes y entregas y se ordenan solos en el calendario.">
<meta name="theme-color" content="#F3F2F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ordénate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
</head>
<body>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: cabecera + un panel que se desplaza (dos lado a lado desde 860px) + barra de pestañas inferior.
   Color: papel lila frío, tinta violeta oscura, subrayador lima como acento; rojo solo para lo urgente. */
:root {
  --bg: #F3F2F9;
  --surface: #FFFFFF;
  --surface-2: #EBE9F4;
  --ink: #18162C;
  --muted: #66627E;
  --line: #DEDBEB;
  --hl: #DDFB4E;
  --hl-ink: #18162C;
  --me-bg: #18162C;
  --me-fg: #F7F6FF;
  --urgent: #DD2C25;
  --urgent-bg: #FDEDEC;
  --urgent-line: #F4B7B3;
  --on-urgent: #FFFFFF;
  --ok: #1E9E62;
  --t-examen: #7657F5;
  --t-entrega: #2C7CF6;
  --t-cita: #0C9C97;
  --t-actividad: #E8761A;
  --t-cumple: #D6449A;
  --t-otro: #7A7F97;
  --shadow: 0 1px 2px rgba(24, 22, 44, .06), 0 10px 28px rgba(24, 22, 44, .07);
  --backdrop: rgba(24, 22, 44, .38);
  --f-display: "Bricolage Grotesque", "Plus Jakarta Sans", ui-rounded, system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 11px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0E19; --surface: #1A1828; --surface-2: #24223A; --ink: #F1EFFD; --muted: #A19DBB; --line: #2D2A44;
    --hl: #D6F73F; --hl-ink: #15131F; --me-bg: #D6F73F; --me-fg: #15131F;
    --urgent: #FF5B52; --urgent-bg: #3A1619; --urgent-line: #6E2529; --on-urgent: #FFFFFF; --ok: #3DD08A;
    --t-examen: #9C85FF; --t-entrega: #5E9DFF; --t-cita: #2CC6BF; --t-actividad: #FF9A45; --t-cumple: #F26CBB; --t-otro: #9EA3BA;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 28px rgba(0, 0, 0, .35); --backdrop: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0E19; --surface: #1A1828; --surface-2: #24223A; --ink: #F1EFFD; --muted: #A19DBB; --line: #2D2A44;
  --hl: #D6F73F; --hl-ink: #15131F; --me-bg: #D6F73F; --me-fg: #15131F;
  --urgent: #FF5B52; --urgent-bg: #3A1619; --urgent-line: #6E2529; --on-urgent: #FFFFFF; --ok: #3DD08A;
  --t-examen: #9C85FF; --t-entrega: #5E9DFF; --t-cita: #2CC6BF; --t-actividad: #FF9A45; --t-cumple: #F26CBB; --t-otro: #9EA3BA;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 28px rgba(0, 0, 0, .35); --backdrop: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2.5px solid var(--t-entrega); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.topbar { background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 12px; padding: 10px var(--gut-r) 10px var(--gut-l); min-height: 56px; }
.brand { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 25px; letter-spacing: -.02em; line-height: 1; }
.brand mark { background: var(--hl); color: var(--hl-ink); padding: 0 4px 2px; margin-left: 1px; border-radius: 6px 3px 7px 3px; display: inline-block; transform: rotate(-2deg); }
.today-chip { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.today-chip b { color: var(--ink); font-weight: 700; }
.toptabs { display: none; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; margin-left: 24px; }
.toptabs button { padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.toptabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.panes { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.view { display: none; min-height: 0; min-width: 0; grid-row: 1; grid-column: 1; flex-direction: column; }
.view.active { display: flex; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.pane-in { max-width: 760px; margin: 0 auto; padding: 18px var(--gut-r) 28px var(--gut-l); display: flex; flex-direction: column; gap: 18px; }

.tabbar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px var(--gut-r) 6px var(--gut-l);
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative; }
.tab .ico { width: 54px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .ico { background: var(--hl); color: var(--hl-ink); }
.badge {
  position: absolute; top: 0; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 800;
  display: grid; place-items: center; font-variant-numeric: tabular-nums; border: 2px solid var(--surface);
}
.badge.red { background: var(--urgent); color: var(--on-urgent); }
.toptabs .badge { position: static; border: 0; height: 18px; }
body.typing .tabbar { display: none; }

@media (min-width: 860px) {
  .panes { grid-template-columns: minmax(340px, 410px) minmax(0, 1fr); }
  #view-chat { display: flex; grid-column: 1; border-right: 1px solid var(--line); background: var(--surface); }
  .view:not(#view-chat) { grid-column: 2; }
  .tabbar { display: none; }
  .toptabs { display: flex; }
  .pane-in { padding-top: 26px; }
}

/* ---------- Chat ---------- */
.chat-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.chat-list { max-width: 680px; margin: 0 auto; padding: 18px var(--gut-r) 12px var(--gut-l); display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; flex-direction: column; gap: 6px; max-width: 88%; min-width: 0; }
.msg.new { animation: pop .22s ease-out both; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.bot { align-self: flex-start; }
.bubble { padding: 10px 14px; border-radius: 20px; overflow-wrap: anywhere; }
.me .bubble { background: var(--me-bg); color: var(--me-fg); border-bottom-right-radius: 6px; font-weight: 500; }
.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
@media (min-width: 860px) { .bot .bubble { background: var(--bg); } }
.bubble p { margin: 0; }
.bubble p + p { margin-top: 6px; }
.bubble strong { font-weight: 700; }
.bubble .hint { color: var(--muted); font-size: 13.5px; }
.msg-time { font-size: 11px; color: var(--muted); padding: 0 6px; }
@keyframes pop { from { opacity: .4; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px;
  font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: transform .1s, background .15s;
}
.chip:hover { background: var(--surface-2); }
.chip:active { transform: scale(.97); }
.chip.hl { background: var(--hl); color: var(--hl-ink); border-color: transparent; }

/* Tarjeta de lo entendido */
.draft {
  width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow);
}
.draft-kicker { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.draft-kicker .left { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12.5px; }
.draft-kicker .left.red { color: var(--urgent); }
.draft-title {
  width: 100%; border: 0; border-bottom: 2px dashed var(--line); background: transparent; padding: 2px 0 6px;
  font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: -.01em; border-radius: 0;
}
.draft-title:focus { outline: none; border-bottom-color: var(--ink); }
.field-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.field input, .field textarea, .field select {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-sm);
  padding: 9px 10px; font-size: 16px; font-weight: 500; color: var(--ink); min-height: 42px;
}
.field textarea { resize: vertical; min-height: 70px; }
.type-picks { display: flex; flex-wrap: wrap; gap: 6px; }
.tpick {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted);
}
.tpick[aria-checked="true"] { color: var(--ink); border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.draft-note { margin: 0; font-size: 13px; color: var(--muted); }
.draft-note.red { color: var(--urgent); font-weight: 600; }
.draft-actions { display: flex; gap: 8px; }
.draft.saved { flex-direction: row; align-items: center; gap: 10px; padding: 10px 12px; box-shadow: none; }
.draft.saved .ok { width: 26px; height: 26px; border-radius: 50%; background: var(--hl); color: var(--hl-ink); display: grid; place-items: center; flex: none; }
.draft.saved .txt { min-width: 0; flex: 1; font-size: 14px; }
.draft.saved .txt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.draft.saved .txt span { color: var(--muted); font-size: 12.5px; }
.draft.discarded { opacity: .55; box-shadow: none; padding: 10px 12px; font-size: 13.5px; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; min-height: 42px;
  border-radius: 999px; font-weight: 700; font-size: 14.5px; border: 1px solid var(--line); background: var(--surface);
  transition: transform .1s, background .15s; text-decoration: none; color: var(--ink);
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.hl { background: var(--hl); color: var(--hl-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--urgent); border-color: var(--urgent-line); background: transparent; }
.btn.danger.solid { background: var(--urgent); color: var(--on-urgent); border-color: transparent; }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }

.mini-list { display: flex; flex-direction: column; gap: 6px; width: min(380px, 100%); }
.mini {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%;
}
.mini .md { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 12.5px; color: var(--muted); min-width: 74px; flex: none; white-space: nowrap; }
.mini .mt { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .ml { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.mini.urgent { border-color: var(--urgent-line); background: var(--urgent-bg); }
.mini.urgent .ml { color: var(--urgent); }
.mini.done .mt { text-decoration: line-through; color: var(--muted); }

/* Compositor */
.composer { border-top: 1px solid var(--line); background: var(--bg); padding: 8px var(--gut-r) 10px var(--gut-l); display: flex; flex-direction: column; gap: 8px; }
@media (min-width: 860px) { .composer { background: var(--surface); } }
.composer-in { max-width: 680px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.suggest { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l)); padding: 0 var(--gut-r) 0 var(--gut-l); }
.suggest::-webkit-scrollbar { display: none; }
.live {
  display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted);
  padding: 6px 10px; border-radius: var(--r-sm); background: var(--surface-2); min-width: 0;
}
.live .lt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.live b { color: var(--ink); }
.live.warn b { color: var(--urgent); }
.composer-row { display: flex; align-items: flex-end; gap: 8px; }
.composer textarea {
  flex: 1; min-width: 0; resize: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 22px;
  padding: 11px 16px; font-size: 16px; line-height: 1.35; max-height: 140px; min-height: 46px; color: var(--ink);
}
.composer textarea:focus { outline: none; border-color: var(--ink); }
.send {
  width: 46px; height: 46px; border-radius: 50%; background: var(--hl); color: var(--hl-ink); display: grid; place-items: center; flex: none;
  transition: transform .12s;
}
.send:active { transform: scale(.92); }
.send svg { width: 22px; height: 22px; }

/* ---------- Encabezados de sección ---------- */
.h-sec { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.h-sec h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 32px; letter-spacing: -.025em; line-height: 1.05; text-wrap: balance; }
.h-sec p { margin: 0; color: var(--muted); font-size: 14px; flex-basis: 100%; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill.red { background: var(--urgent); color: var(--on-urgent); }
.pill.hl { background: var(--hl); color: var(--hl-ink); }
.h-sub { margin: 4px 0 -6px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.h-sub button { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 700; color: var(--ink); }

/* ---------- Próximas ---------- */
.plist { display: flex; flex-direction: column; gap: 10px; }
.pcard {
  display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow); overflow: hidden;
}
.pmain { flex: 1; min-width: 0; display: flex; align-items: stretch; text-align: left; }
.count {
  width: 84px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-right: 1px dashed var(--line); padding: 12px 6px; gap: 2px;
}
.count .num { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.count .unit { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pbody { flex: 1; min-width: 0; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.ptitle { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.pmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
.tchip { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); }
.pips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; max-width: 180px; }
.pips i { height: 5px; border-radius: 3px; background: var(--surface-2); }
.pips i.on { background: var(--ink); }
.pstatus { font-size: 13px; font-weight: 700; }
.check {
  width: 58px; flex: none; display: grid; place-items: center; border-left: 1px solid var(--line);
}
.check span {
  width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--line); display: grid; place-items: center;
  transition: background .2s, border-color .2s, transform .15s;
}
.check:hover span { border-color: var(--muted); }
.check svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s; }
.pcard.done .check span { background: var(--ok); border-color: var(--ok); color: #fff; }
.pcard.done .check svg { opacity: 1; }
.pcard.done { box-shadow: none; }
.pcard.done .ptitle { text-decoration: line-through; color: var(--muted); }
.pcard.done .num { color: var(--muted); }
.check.burst span { animation: burst .45s ease-out; }
@keyframes burst { 0% { transform: scale(1); } 40% { transform: scale(1.3); box-shadow: 0 0 0 8px color-mix(in srgb, var(--ok) 25%, transparent); } 100% { transform: scale(1); box-shadow: 0 0 0 14px transparent; } }

.pcard.urgent { background: var(--urgent-bg); border-color: var(--urgent-line); }
.pcard.urgent .count { border-right-color: var(--urgent-line); }
.pcard.urgent .num, .pcard.urgent .pstatus { color: var(--urgent); }
.pcard.urgent .pips i.on { background: var(--urgent); }
.pcard.urgent .check { border-left-color: var(--urgent-line); }
.pcard.today { background: var(--urgent); border-color: transparent; color: var(--on-urgent); }
.pcard.today .count { border-right-color: color-mix(in srgb, var(--on-urgent) 35%, transparent); }
.pcard.today .num { font-size: 28px; letter-spacing: -.01em; }
.pcard.today .unit, .pcard.today .pmeta, .pcard.today .tchip { color: var(--on-urgent); }
.pcard.today .pips i { background: color-mix(in srgb, var(--on-urgent) 30%, transparent); }
.pcard.today .pips i.on { background: var(--on-urgent); }
.pcard.today .check { border-left-color: color-mix(in srgb, var(--on-urgent) 35%, transparent); }
.pcard.today .check span { border-color: color-mix(in srgb, var(--on-urgent) 70%, transparent); }
.pcard.today .dot { box-shadow: 0 0 0 2px var(--on-urgent); }
.pcard.today .pstatus { display: inline-flex; align-items: center; gap: 6px; }
.pcard.today .pstatus::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--on-urgent); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

.later { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 11px 14px; text-align: left; width: 100%; }
.lrow + .lrow { border-top: 1px solid var(--line); }
.ldate { width: 44px; flex: none; text-align: center; line-height: 1; }
.ldate b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ldate span { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
