  var S = sanitize(readLocal());
  var now0 = new Date();
  var UI = {
    view: null, calY: now0.getFullYear(), calM: now0.getMonth(), sel: todayISO(), day: todayISO(),
    showDone: false, sheet: null, undo: null, installEvt: null, alertQueue: [], seen: {}, toastT: 0, wipe: false, themeTouched: false
  };

  function persist() {
    S.savedAt = Date.now();
    if (S.messages.length > 80) S.messages = S.messages.slice(-80);
    for (var id in S.notified) if (!findTask(id)) delete S.notified[id];
    writeLocal();
    idbMirror();
    Cloud.push();
  }

  /* Guardado en tu cuenta (cuando la app se abre dentro de Claude) */
  var Cloud = {
    ref: null, writing: false, dirty: false, timer: 0, ready: false,
    init: function () {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
        var db = r[0], user = r[1];
        if (!db || !user) return null;
        return user.id().then(function (id) {
          if (!id) return;
          Cloud.ref = db.doc('data/users/' + id + '/state');
          Cloud.ref.onSnapshot(Cloud.onSnap, function () { Cloud.ref = null; });
          renderAjustes();
        });
      }).catch(function () { /* sin nube: seguimos en local */ });
    },
    onSnap: function (snap) {
      if (!snap.exists) {
        if (!Cloud.ready) { Cloud.ready = true; if (S.tasks.length) Cloud.push(); }
        return;
      }
      Cloud.ready = true;
      var d = snap.data() || {};
      var remote;
      try { remote = JSON.parse(d.json); } catch (e) { return; }
      var rs = +d.savedAt || 0;
      if (rs > S.savedAt) {
        S = sanitize(remote);
        S.savedAt = rs;
        writeLocal();
        applyTheme();
        renderAll();
        checkAlerts();
      } else if (rs < S.savedAt && !snap.metadata.hasPendingWrites && !snap.metadata.fromCache) {
        Cloud.push();
      }
    },
    push: function () {
      if (!Cloud.ref) return;
      clearTimeout(Cloud.timer);
      Cloud.timer = setTimeout(Cloud.flush, 700);
    },
    flush: function () {
      if (!Cloud.ref) return;
      if (Cloud.writing) { Cloud.dirty = true; return; }
      Cloud.writing = true; Cloud.dirty = false;
      Cloud.ref.set({ json: JSON.stringify(S), savedAt: S.savedAt }).catch(function () { }).then(function () {
        Cloud.writing = false;
        if (Cloud.dirty) Cloud.flush();
      });
    }
  };

  /* Copia para el service worker (avisos en segundo plano en Android) */
  function idbOpen() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('ordenate', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function idbSet(k, v) {
    return idbOpen().then(function (db) {
      return new Promise(function (res) { var tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; });
    }).catch(function () { });
  }
  function idbGet(k) {
    return idbOpen().then(function (db) {
      return new Promise(function (res) { var tx = db.transaction('kv', 'readonly'); var q = tx.objectStore('kv').get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(null); }; });
    }).catch(function () { return null; });
  }
  function idbMirror() {
    if (!HOSTED || !window.indexedDB) return;
    idbSet('state', { tasks: S.tasks, notified: S.notified });
  }

  /* ---------- Tareas ---------- */
  function armStages(t) { var s = stageOf(t); S.notified[t.id] = s ? stagesUpTo(s) : []; }
  function createTask(src) {
    var t = {
      id: uid(), title: String(src.title || '').trim(), date: src.date, time: src.time || '', type: TYPES[src.type] ? src.type : 'otro',
      notes: src.notes || '', done: false, createdAt: Date.now(), updatedAt: Date.now()
    };
    S.tasks.push(t);
    armStages(t);
    return t;
  }

  /* ---------- Avisos ---------- */
  function checkAlerts() {
    var list = [];
    S.tasks.forEach(function (t) {
      var s = stageOf(t);
      if (!s) return;
      var got = S.notified[t.id] || [];
      if (got.indexOf(s) === -1) { list.push({ id: t.id, s: s }); S.notified[t.id] = stagesUpTo(s); }
    });
    if (!list.length) return;
    persist();
    sysNotify(list);
    if (UI.sheet) { UI.alertQueue = UI.alertQueue.concat(list); return; }
    openAlerts(list);
  }
  function alertText(a) {
    var t = findTask(a.id); if (!t) return null;
    var d = daysLeft(t.date);
    if (a.s === 'today') return { title: '¡Hoy! ' + t.title, body: (t.time ? 'A las ' + t.time + ' · ' : '') + TYPES[t.type].label };
    if (a.s === 'three') return { title: (d === 1 ? 'Mañana: ' : 'Faltan ' + d + ' días: ') + t.title, body: fmtLong(t.date) + (t.time ? ' · ' + t.time : '') };
    return { title: (d === 7 ? 'Falta 1 semana: ' : 'Faltan ' + d + ' días: ') + t.title, body: 'Ya está en Próximas · ' + fmtLong(t.date) };
  }
  function sysNotify(list) {
    if (!CAN_NOTIFY || Notification.permission !== 'granted') return;
    list.forEach(function (a) {
      var tx = alertText(a); if (!tx) return;
      var opts = { body: tx.body, tag: a.id + ':' + a.s, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png' };
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(function (r) { r.showNotification(tx.title, opts); }).catch(function () { });
      } else {
        try { new Notification(tx.title, opts); } catch (e) { /* algunos móviles solo aceptan avisos desde el service worker */ }
      }
    });
  }

  /* ---------- Exportar al calendario del móvil ---------- */
  function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  function icsFold(line) {
    var out = [], cur = '';
    Array.from(line).forEach(function (ch) {
      if (new Blob([cur + ch]).size > 73) { out.push(cur); cur = ' ' + ch; } else cur += ch;
    });
    out.push(cur);
    return out.join('\r\n');
  }
  function stamp(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
  function addHour(t) {
    var p = t.time.split(':').map(Number);
    var d = P.fromISO(t.date); d.setHours(p[0] + 1, p[1], 0, 0);
    return P.iso(d).replace(/-/g, '') + 'T' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '00';
  }
  function icsFor(tasks) {
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ordenate//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Ordénate'];
    tasks.forEach(function (t) {
      var d = t.date.replace(/-/g, '');
      var label = TYPES[t.type].emoji + ' ' + t.title;
      L.push('BEGIN:VEVENT', 'UID:' + t.id + '@ordenate', 'DTSTAMP:' + stamp(new Date()));
      if (t.time) {
        L.push('DTSTART:' + d + 'T' + t.time.replace(':', '') + '00', 'DTEND:' + addHour(t));
      } else {
        L.push('DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + P.iso(P.addDays(P.fromISO(t.date), 1)).replace(/-/g, ''));
      }
      L.push('SUMMARY:' + icsEsc(label));
      if (t.notes) L.push('DESCRIPTION:' + icsEsc(t.notes));
      // Alarmas: 1 semana antes, 3 días antes y el mismo día (a las 9:00 / 8:00 si es de día entero)
      var al = t.time
        ? [['-P7D', 'Falta 1 semana'], ['-P3D', 'Faltan 3 días'], ['-PT1H', 'Dentro de 1 hora']]
        : [['-P6DT15H', 'Falta 1 semana'], ['-P2DT15H', 'Faltan 3 días'], ['PT8H', 'Es hoy']];
      al.forEach(function (a) {
        L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(a[1] + ': ' + t.title), 'TRIGGER:' + a[0], 'END:VALARM');
      });
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.map(icsFold).join('\r\n') + '\r\n';
  }
  function openICS(tasks) {
    var blob = new Blob([icsFor(tasks)], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    if (IS_IOS) a.target = '_blank'; else a.download = tasks.length === 1 ? slug(tasks[0].title) + '.ics' : 'ordenate.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }
  function slug(s) { return P.norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'tarea'; }
  function gcalURL(t) {
    var d = t.date.replace(/-/g, ''), dates;
    if (t.time) dates = d + 'T' + t.time.replace(':', '') + '00/' + addHour(t);
    else dates = d + '/' + P.iso(P.addDays(P.fromISO(t.date), 1)).replace(/-/g, '');
    var tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { }
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(TYPES[t.type].emoji + ' ' + t.title) +
      '&dates=' + dates + (t.notes ? '&details=' + encodeURIComponent(t.notes) : '') + (tz ? '&ctz=' + encodeURIComponent(tz) : '');
  }

  /* ---------- Chat ---------- */
  function addMsg(m) { m.id = m.id || uid(); m.ts = Date.now(); S.messages.push(m); return m; }
  function bot(text, extra) { return addMsg(Object.assign({ from: 'bot', kind: 'text', text: text }, extra || {})); }

  function isQuery(n) {
    return /\?/.test(n) || /^(que\s+(tengo|hay|me\s+toca|toca|examenes|entregas)|cuando\b|cuant[oa]s?\b|ver\b|lista\b|listar\b|muestra|mostrar|ensena|dime\b|mis\s+(tareas|examenes|cosas|entregas|citas)|resumen|agenda|tengo\s+algo|hay\s+algo)/.test(n);
  }

  function respond(text) {
    var n = P.norm(text).trim().replace(/^[¡¿\s]+/, '');
    if (/^(hola|holi|buenas|hey|ey|ayuda|help|que puedes hacer|como funciona|como va esto|instrucciones)\b/.test(n) && !/\d/.test(n) && n.split(/\s+/).length <= 5) return help();
    if (/^(gracias|ok|okey|vale|genial|guay|perfecto|de acuerdo|bien|top|crack|buenisimo|mola)\b[!.\s]*$/.test(n)) return bot('¡De nada! Aquí sigo para lo que necesites.');
    if (isQuery(n)) return answerQuery(text, n);

    var items = P.parseMany(text, new Date());
    var pend = S.pending;
    if (pend) {
      resolveAsk();
      if (items.length === 1) {
        var it = items[0];
        if (pend.title && it.date && !it.title) {
          S.pending = null;
          return makeDrafts([{ title: pend.title, type: pend.type, date: it.date, time: it.time || pend.time || '' }]);
        }
        if (pend.date && !it.date && it.title && !it.invalidDate) {
          S.pending = null;
          return makeDrafts([{ title: it.title, type: it.type, date: pend.date, time: it.time || pend.time || '' }]);
        }
      }
      S.pending = null;
    }

    if (items.length === 1) {
      var one = items[0];
      if (one.invalidDate) return bot('Esa fecha no existe en el calendario. ¿Me la repites? Por ejemplo: **el 28 de febrero**.');
      if (!one.date && !one.title) return notUnderstood();
      if (!one.date) {
        S.pending = { title: one.title, type: one.type, time: one.time };
        return addMsg({ from: 'bot', kind: 'ask', text: 'Vale, **' + one.title + '**. ¿Para qué día es?' });
      }
      if (!one.title) {
        S.pending = { date: one.date, time: one.time };
        return bot('¿Y qué tienes el **' + fmtLong(one.date) + '**? Escríbeme qué es, por ejemplo: **examen de mates**.');
      }
      return makeDrafts([one]);
    }
    var ok = items.filter(function (i) { return i.date; }).map(function (i) {
      return { title: i.title || TYPES[i.type].label, type: i.type, date: i.date, time: i.time };
    });
    if (!ok.length) return notUnderstood();
    return makeDrafts(ok);
  }

  function makeDrafts(list) {
    var drafts = list.map(function (i) {
      return { id: uid(), title: i.title, type: i.type || 'otro', date: i.date, time: i.time || '', status: 'draft' };
    });
    if (S.settings.autoSave) {
      drafts.forEach(function (d) { var t = createTask(d); d.status = 'saved'; d.taskId = t.id; });
      return addMsg({ from: 'bot', kind: 'drafts', text: drafts.length === 1 ? '¡Apuntado!' : '¡Apuntadas ' + drafts.length + ' cosas!', drafts: drafts });
    }
    return addMsg({
      from: 'bot', kind: 'drafts', drafts: drafts,
      text: drafts.length === 1 ? 'Esto es lo que he entendido. Si está bien, dale a **Guardar**:' : 'He encontrado **' + drafts.length + ' cosas**. Revísalas y guárdalas:'
    });
  }

  function resolveAsk() {
    for (var i = S.messages.length - 1; i >= 0; i--) { var m = S.messages[i]; if (m.kind === 'ask' && !m.resolved) { m.resolved = true; break; } }
  }

  function help() {
    return addMsg({
      from: 'bot', kind: 'help',
      text: 'Escríbeme tus cosas como se lo dirías a alguien y yo las coloco en el calendario. Entiendo cosas como:\n' +
        '**examen de lengua el 9 de diciembre**\n**entregar trabajo de historia el viernes**\n**dentista mañana a las 5 de la tarde**\n**redacción de inglés en 2 semanas**\n\n' +
        'También puedes preguntarme: **¿qué tengo esta semana?** o **¿cuándo es el examen de mates?**'
    });
  }
  function notUnderstood() {
    return addMsg({ from: 'bot', kind: 'help', text: 'No he encontrado ninguna tarea en eso. Prueba con algo así: **examen de lengua el 9 de diciembre**.' });
  }

  function answerQuery(text, n) {
    var tasks = S.tasks.slice().sort(byDate);
    var typeF = /\bexamen(es)?\b|\bcontrol(es)?\b|\bpruebas?\b/.test(n) ? 'examen'
      : /\bentregas?\b|\btrabajos?\b|\bdeberes\b|\bproyectos?\b/.test(n) ? 'entrega'
        : /\bcitas?\b|\bmedico\b|\bdentista\b/.test(n) ? 'cita'
          : /\bcumples?\b|\bcumpleanos\b/.test(n) ? 'cumple' : null;

    if (/^cuando\b/.test(n)) {
      var stop = { cuando: 1, es: 1, son: 1, el: 1, la: 1, los: 1, las: 1, de: 1, del: 1, mi: 1, mis: 1, tengo: 1, hay: 1, que: 1, toca: 1, me: 1, un: 1, una: 1, era: 1, tenia: 1, tiene: 1 };
      var words = n.replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(function (w) { return w.length >= 3 && !stop[w]; });
      var match = function (all) {
        return tasks.filter(function (t) {
          var tn = P.norm(t.title);
          var hit = function (w) { return tn.indexOf(w) !== -1 || (w.length > 4 && tn.indexOf(w.slice(0, -1)) !== -1); };
          return words.length && (all ? words.every(hit) : words.some(hit));
        });
      };
      var found = match(true); if (!found.length) found = match(false);
      if (!found.length) return bot('No encuentro nada con ese nombre. Mira el **Calendario** o pregúntame **¿qué tengo este mes?**');
      var up = found.filter(function (t) { return daysLeft(t.date) >= 0; });
      var show = up.length ? up : found;
      var first = show[0];
      return addMsg({
        from: 'bot', kind: 'list', ids: show.slice(0, 6).map(function (t) { return t.id; }),
        text: show.length === 1 ? '**' + first.title + '** es el **' + fmtLong(first.date) + '**' + (first.time ? ' a las ' + first.time : '') + '. ' + leftLabel(daysLeft(first.date)) + '.' : 'He encontrado ' + show.length + ':'
      });
    }

    var r = P.parseRange(text, new Date());
    var from, to, label, def = false;
    if (r) { from = r.from; to = r.to; label = r.single ? 'el ' + fmtLong(r.from) : r.label; }
    else if (typeF) { from = todayISO(); to = '9999-12-31'; label = 'por delante'; }
    else { from = todayISO(); to = P.iso(P.addDays(new Date(), 7)); label = 'en los próximos 7 días'; def = true; }
    var list = tasks.filter(function (t) { return t.date >= from && t.date <= to && (!typeF || t.type === typeF); });
    var noun = typeF ? TYPES[typeF].plural : null;
    var txt;
    if (!list.length) txt = 'No tienes ' + (noun || 'nada') + ' ' + label + '. ¡Libre!';
    else txt = 'Tienes **' + list.length + ' ' + (noun ? (list.length === 1 ? TYPES[typeF].label.toLowerCase() : noun) : (list.length === 1 ? 'cosa' : 'cosas')) + '** ' + label + ':';
    if (def) {
      var later = tasks.filter(function (t) { return !t.done && t.date > to; }).length;
      if (later) txt += (list.length ? '' : '') + '\n\nY ' + plural(later, 'más', 'más') + ' adelante.';
    }
    return addMsg({ from: 'bot', kind: 'list', text: txt, ids: list.map(function (t) { return t.id; }) });
  }

  function askResolve(date, label) {
    var p = S.pending;
    addMsg({ from: 'me', kind: 'text', text: label });
    resolveAsk();
    S.pending = null;
    if (p && p.title) makeDrafts([{ title: p.title, type: p.type, date: date, time: p.time || '' }]);
    else { S.pending = { date: date }; bot('¿Y qué tienes el **' + fmtLong(date) + '**?'); }
    persist(); renderAll(); scrollChat(true);
  }

  function send(text) {
    text = String(text || '').trim();
    if (!text) return;
    addMsg({ from: 'me', kind: 'text', text: text });
    respond(text);
    persist();
    renderAll();
    scrollChat(true);
  }

  /* ---------- Render: chat ---------- */
  function typePicks(sel) {
    return '<div class="type-picks" role="radiogroup" aria-label="Tipo">' + TYPE_ORDER.map(function (k) {
      return '<button type="button" class="tpick" role="radio" aria-checked="' + (k === sel) + '" data-act="pick-type" data-type="' + k + '" style="--c:var(--t-' + k + ')"><span class="dot"></span>' + TYPES[k].label + '</button>';
    }).join('') + '</div>';
  }
  function draftNote(d) {
    if (!d.date) return { t: 'Elige un día para poder guardarla.', w: true };
    var dl = daysLeft(d.date);
    if (dl < 0) return { t: 'Ojo: esa fecha ya ha pasado.', w: true };
    if (dl <= 7) return { t: 'Entra directamente en Próximas' + (dl <= 3 ? ' y sale en rojo.' : '.'), w: dl <= 3 };
    return { t: 'Entrará en Próximas el ' + fmtShort(enterDate(d.date)) + ' (cuando falte 1 semana).', w: false };
  }
  function draftHTML(m, d) {
    if (d.status === 'saved') {
      var t = findTask(d.taskId);
      if (!t) return '<div class="draft discarded">Borrada: ' + esc(d.title) + '</div>';
      return '<div class="draft saved"><span class="ok">' + ICON.check + '</span><div class="txt"><b>' + esc(t.title) + '</b><span>Guardado · ' + fmtShort(t.date) + (t.time ? ' · ' + t.time : '') + ' · ' + leftLabel(daysLeft(t.date)) + '</span></div><button class="btn small" data-act="open-task" data-id="' + t.id + '">Ver</button></div>';
    }
    if (d.status === 'discarded') return '<div class="draft discarded">Descartado: ' + esc(d.title || 'sin título') + '</div>';
    var dl = d.date ? daysLeft(d.date) : null;
    var note = draftNote(d);
    return '<div class="draft" data-msg="' + m.id + '" data-draft="' + d.id + '">' +
      '<div class="draft-kicker"><span class="dot" style="--c:var(--t-' + d.type + ')"></span>' + TYPES[d.type].label +
      '<span class="left' + (dl != null && dl >= 0 && dl <= 3 ? ' red' : '') + '">' + (d.date ? leftLabel(dl) : 'Sin fecha') + '</span></div>' +
      '<label class="sr" for="dt-' + d.id + '">Título</label><input class="draft-title" id="dt-' + d.id + '" data-f="title" value="' + esc(d.title) + '" placeholder="¿Qué es?" enterkeyhint="done">' +
      '<div class="field-row"><label class="field">Día<input type="date" id="dd-' + d.id + '" data-f="date" value="' + esc(d.date || '') + '"></label>' +
      '<label class="field">Hora<input type="time" id="dh-' + d.id + '" data-f="time" value="' + esc(d.time || '') + '"></label></div>' +
      typePicks(d.type) +
      '<p class="draft-note' + (note.w ? ' red' : '') + '">' + esc(note.t) + '</p>' +
      '<div class="draft-actions"><button type="button" class="btn primary" data-act="save-draft">' + ICON.check + 'Guardar</button><button type="button" class="btn ghost" data-act="discard-draft">Descartar</button></div>' +
      '</div>';
  }
  function miniHTML(t) {
    var d = daysLeft(t.date);
    var cls = t.done ? ' done' : (d >= 0 && d <= 3 ? ' urgent' : '');
    return '<button type="button" class="mini' + cls + '" data-act="open-task" data-id="' + t.id + '"><span class="md">' + fmtShort(t.date).replace(/ \d{4}$/, '') + '</span>' +
      '<span class="dot" style="--c:var(--t-' + t.type + ')"></span><span class="mt">' + esc(t.title) + '</span><span class="ml">' + (t.done ? 'Hecha' : leftLabel(d)) + '</span></button>';
  }
  function askHTML(m) {
    if (m.resolved) return '';
    var chips = [{ l: 'Hoy', d: todayISO() }, { l: 'Mañana', d: P.iso(P.addDays(new Date(), 1)) }];
    for (var i = 2; i <= 7; i++) { var x = P.addDays(new Date(), i); chips.push({ l: DIAS_C[x.getDay()] + ' ' + x.getDate(), d: P.iso(x) }); }
    return '<div class="chips">' + chips.map(function (c) {
      return '<button type="button" class="chip" data-act="ask-chip" data-date="' + c.d + '">' + c.l + '</button>';
    }).join('') + '</div><label class="field" style="max-width:220px">Otra fecha<input type="date" id="ask-' + m.id + '" data-ask="1"></label>';
  }
  var EXAMPLES = ['Examen de lengua el 9 de diciembre', 'Entregar trabajo de historia el viernes', 'Dentista mañana a las 5 de la tarde', '¿Qué tengo esta semana?'];
  function welcomeHTML() {
    return '<div class="bubble"><p><strong>¡Hola! Soy tu agenda.</strong> Escríbeme lo que tengas, con su fecha, y yo lo coloco en el calendario.</p>' +
      '<p>Cuando falte <strong>1 semana</strong>, la tarea pasa a <strong>Próximas</strong> y te aviso. Si quedan <strong>3 días o menos</strong>, se pone en rojo.</p>' +
      '<p class="hint">Toca un ejemplo para probar:</p></div>' +
      '<div class="chips">' + EXAMPLES.map(function (e) { return '<button type="button" class="chip" data-act="example" data-text="' + esc(e) + '">' + esc(e) + '</button>'; }).join('') + '</div>';
  }
  function msgHTML(m) {
    var who = m.from === 'me' ? 'me' : 'bot';
    var inner = '';
    if (m.kind === 'welcome') inner = welcomeHTML();
    else {
      if (m.text) inner += '<div class="bubble">' + fmtText(m.text) + '</div>';
      if (m.kind === 'drafts') {
        inner += m.drafts.map(function (d) { return draftHTML(m, d); }).join('');
        if (m.drafts.filter(function (d) { return d.status === 'draft'; }).length > 1) inner += '<button type="button" class="btn hl small" data-act="save-all" data-msg="' + m.id + '">' + ICON.check + 'Guardar todas</button>';
      }
      if (m.kind === 'list') {
        var ts = (m.ids || []).map(findTask).filter(Boolean);
        if (ts.length) inner += '<div class="mini-list">' + ts.map(miniHTML).join('') + '</div>';
      }
      if (m.kind === 'ask') inner += askHTML(m);
      if (m.kind === 'help') inner += '<div class="chips">' + EXAMPLES.slice(0, 3).map(function (e) { return '<button type="button" class="chip" data-act="example" data-text="' + esc(e) + '">' + esc(e) + '</button>'; }).join('') + '</div>';
    }
    var isNew = !UI.seen[m.id]; UI.seen[m.id] = 1;
    return '<div class="msg ' + who + (isNew ? ' new' : '') + '" data-id="' + m.id + '">' + inner + '</div>';
  }
  function renderChat() {
    var sc = $('#chatScroll');
    var nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
    var top = sc.scrollTop;
    $('#chatList').innerHTML = S.messages.map(msgHTML).join('');
    if (nearBottom) sc.scrollTop = sc.scrollHeight; else sc.scrollTop = top;
  }
  function scrollChat(smooth) {
    var sc = $('#chatScroll');
    requestAnimationFrame(function () { sc.scrollTo({ top: sc.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); });
  }
  function rerenderMsg(m) {
    var el = $('#chatList .msg[data-id="' + m.id + '"]');
    if (el) el.outerHTML = msgHTML(m);
  }
  function msgById(id) { for (var i = 0; i < S.messages.length; i++) if (S.messages[i].id === id) return S.messages[i]; return null; }

  function renderSuggest() {
    var box = $('#suggest');
    var items;
    if (S.pending && S.pending.title) {
      items = [{ l: 'Mañana', send: 'mañana' }, { l: 'El lunes', send: 'el lunes' }, { l: 'El viernes', send: 'el viernes' }, { l: 'En una semana', send: 'en una semana' }];
    } else if (S.pending && S.pending.date) {
      items = [{ l: 'Examen de…', fill: 'Examen de ' }, { l: 'Entregar…', fill: 'Entregar ' }, { l: 'Cumple de…', fill: 'Cumple de ' }];
    } else {
      items = [{ l: '¿Qué tengo esta semana?', send: '¿Qué tengo esta semana?' }, { l: 'Examen de…', fill: 'Examen de ' }, { l: 'Entregar trabajo de…', fill: 'Entregar trabajo de ' }, { l: '¿Qué exámenes tengo?', send: '¿Qué exámenes tengo?' }, { l: 'Médico…', fill: 'Médico ' }];
    }
    box.innerHTML = items.map(function (i) {
      return i.send ? '<button type="button" class="chip" data-act="example" data-text="' + esc(i.send) + '">' + esc(i.l) + '</button>'
        : '<button type="button" class="chip" data-act="fill" data-text="' + esc(i.fill) + '">' + esc(i.l) + '</button>';
    }).join('');
  }

  var liveT = 0;
  function updateLive() {
    clearTimeout(liveT);
    liveT = setTimeout(function () {
      var v = $('#msgInput').value.trim();
      var live = $('#live'), sug = $('#suggest');
      if (!v) { live.hidden = true; sug.hidden = false; return; }
      sug.hidden = true;
      var n = P.norm(v);
      var h, warn = false;
      if (isQuery(n.replace(/^[¡¿\s]+/, ''))) {
        h = '<span class="lt">Pregunta: te enseño lo que tienes</span>';
      } else {
        var items = P.parseMany(v, new Date());
        if (items.length > 1) {
          h = '<span class="lt"><b>' + items.length + ' tareas</b> · ' + items.map(function (i) { return esc(i.title || '?') + (i.date ? ' (' + fmtShort(i.date) + ')' : ''); }).join(', ') + '</span>';
        } else {
          var it = items[0];
          if (S.pending && S.pending.title && it.date && !it.title) it = { title: S.pending.title, type: S.pending.type, date: it.date, time: it.time };
          if (it.invalidDate) { warn = true; h = '<span class="lt"><b>Esa fecha no existe</b></span>'; }
          else {
            var bits = [];
            bits.push(it.title ? '<b>' + esc(it.title) + '</b>' : '<b>¿Qué es?</b>');
            if (it.date) bits.push(fmtShort(it.date) + (it.time ? ' · ' + it.time : ''));
            else { bits.push('<b>falta el día</b>'); warn = !S.pending; }
            h = '<span class="dot" style="--c:var(--t-' + it.type + ')"></span><span class="lt">' + bits.join(' · ') + '</span>';
          }
        }
      }
      live.className = 'live' + (warn ? ' warn' : '');
      live.innerHTML = h;
      live.hidden = false;
    }, 90);
  }

  /* ---------- Render: Próximas ---------- */
  function pips(d, cls) {
    var on = Math.max(0, Math.min(7, 7 - d)), s = '';
    for (var i = 0; i < 7; i++) s += '<i' + (i < on ? ' class="on"' : '') + '></i>';
    return '<span class="pips" aria-hidden="true">' + s + '</span>';
  }
  function pcardHTML(t) {
    var d = daysLeft(t.date);
    var cls = t.done ? 'done' : d === 0 ? 'today' : d <= 3 ? 'urgent' : '';
    var num = d === 0 ? 'HOY' : String(d);
    var unit = d === 0 ? (t.time || 'todo el día') : d === 1 ? 'día' : 'días';
    return '<article class="pcard ' + cls + '">' +
      '<button type="button" class="pmain" data-act="open-task" data-id="' + t.id + '" aria-label="' + esc(t.title + ', ' + leftLabel(d)) + '">' +
      '<span class="count"><span class="num">' + num + '</span><span class="unit">' + esc(unit) + '</span></span>' +
      '<span class="pbody"><span class="ptitle">' + esc(t.title) + '</span>' +
      '<span class="pmeta"><span class="tchip"><span class="dot" style="--c:var(--t-' + t.type + ')"></span>' + TYPES[t.type].label + '</span><span>' + fmtShort(t.date) + (t.time ? ' · ' + t.time : '') + '</span></span>' +
      pips(d) +
      (t.done ? '<span class="pstatus" style="color:var(--ok)">Hecha</span>' : '<span class="pstatus">' + leftLabel(d) + '</span>') +
      '</span></button>' +
      '<button type="button" class="check" data-act="toggle-done" data-id="' + t.id + '" aria-pressed="' + t.done + '" aria-label="' + (t.done ? 'Desmarcar' : 'Marcar como hecha') + '"><span>' + ICON.check + '</span></button>' +
      '</article>';
  }
  function installBanner() {
    if (!HOSTED || STANDALONE || !S.settings.installHint) return '';
    var how = UI.installEvt ? '<button type="button" class="btn small" data-act="install">Instalar</button>'
      : IS_IOS ? '<p>Toca <b>Compartir</b> (el cuadrado con la flecha) y luego <b>Añadir a pantalla de inicio</b>.</p>'
        : IS_ANDROID ? '<p>Abre el menú <b>⋮</b> del navegador y toca <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.</p>' : '<p>Usa el icono de instalar de la barra de direcciones.</p>';
    return '<div class="banner"><div class="banner-txt"><p><b>Instala Ordénate como app</b> para abrirla con un toque y recibir avisos.</p>' + how + '</div>' +
      '<button type="button" class="x" data-act="dismiss-install" aria-label="Cerrar">' + ICON.x + '</button></div>';
  }
  function renderProximas() {
    var win = S.tasks.filter(function (t) { var d = daysLeft(t.date); return d >= 0 && d <= 7; }).sort(byDate);
    var pend = win.filter(function (t) { return !t.done; });
    var done = win.filter(function (t) { return t.done; });
    var later = S.tasks.filter(function (t) { return !t.done && daysLeft(t.date) > 7; }).sort(byDate);
    var urgent = pend.filter(function (t) { return daysLeft(t.date) <= 3; }).length;

    var h = installBanner();
    h += '<div class="h-sec"><h2>Próximas</h2><p>Lo que tienes en los próximos 7 días. Con 3 días o menos, se pone en rojo.</p></div>';
    if (pend.length || done.length) {
      h += '<div class="summary"><span class="pill">' + plural(pend.length, 'pendiente', 'pendientes') + '</span>' +
        (urgent ? '<span class="pill red">' + plural(urgent, 'urgente', 'urgentes') + '</span>' : '') +
        (done.length ? '<span class="pill hl">' + plural(done.length, 'hecha', 'hechas') + '</span>' : '') + '</div>';
    }
    if (!pend.length) {
      h += '<div class="empty"><div class="big">' + (done.length ? '¡Todo hecho esta semana!' : 'Semana despejada') + '</div>' +
        '<p>' + (later.length ? 'Lo próximo que tienes entrará aquí cuando falte una semana.' : 'Apunta tus exámenes y entregas en el chat. Cuando falte una semana aparecerán aquí.') + '</p>' +
        '<div class="week-strip" aria-hidden="true">' + [7, 6, 5, 4, 3, 2, 1, 0].map(function (k) {
          return '<div class="' + (k <= 3 ? 'r' : 'w') + '"><i></i>' + (k === 0 ? 'hoy' : k) + '</div>';
        }).join('') + '</div>' +
        '<button type="button" class="btn primary" data-act="go" data-view="chat">' + ICON.plus + 'Apuntar algo</button></div>';
    } else {
      h += '<div class="plist">' + pend.map(pcardHTML).join('') + '</div>';
    }
    if (done.length) {
      h += '<div class="h-sub">Hechas (' + done.length + ')<button type="button" data-act="toggle-show-done">' + (UI.showDone ? 'Ocultar' : 'Mostrar') + '</button></div>';
      if (UI.showDone) h += '<div class="plist">' + done.map(pcardHTML).join('') + '</div>';
    }
    if (later.length) {
      h += '<div class="h-sub">Más adelante</div><div class="later">' + later.slice(0, 6).map(function (t) {
        var d = P.fromISO(t.date);
        return '<button type="button" class="lrow" data-act="open-task" data-id="' + t.id + '"><span class="ldate"><b>' + d.getDate() + '</b><span>' + MESES_C[d.getMonth()] + '</span></span>' +
          '<span class="lbody"><b>' + esc(t.title) + '</b><span>Entra en Próximas el ' + fmtShort(enterDate(t.date)) + ' · faltan ' + daysLeft(t.date) + ' días</span></span>' +
          '<span class="dot" style="--c:var(--t-' + t.type + ')"></span></button>';
      }).join('') + '</div>';
      if (later.length > 6) h += '<button type="button" class="btn" data-act="go" data-view="calendario">' + ICON.cal + 'Ver las ' + later.length + ' en el calendario</button>';
    }
    $('#proximasIn').innerHTML = h;
  }

  /* ---------- Render: Calendario ---------- */
  function renderCal() {
    var y = UI.calY, m = UI.calM;
    var first = new Date(y, m, 1, 12);
    var off = (first.getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var cells = Math.ceil((off + dim) / 7) * 7;
    var start = P.addDays(first, -off);
    var today = todayISO();
    var by = {};
    S.tasks.forEach(function (t) { (by[t.date] = by[t.date] || []).push(t); });
    Object.keys(by).forEach(function (k) { by[k].sort(byDate); });

    var h = '<div class="cal-head"><h2>' + MESES[m] + ' <span>' + y + '</span></h2>' +
      '<button type="button" class="icon-btn" data-act="cal-prev" aria-label="Mes anterior">' + ICON.prev + '</button>' +
      '<button type="button" class="btn small" data-act="cal-today">Hoy</button>' +
      '<button type="button" class="icon-btn" data-act="cal-next" aria-label="Mes siguiente">' + ICON.next + '</button></div>';
    h += '<div class="cal" id="calGrid"><div class="cal-wd">' + WD_HEAD.map(function (w) { return '<div>' + w + '</div>'; }).join('') + '</div><div class="cal-grid">';
    for (var i = 0; i < cells; i++) {
      var d = P.addDays(start, i), iso = P.iso(d), list = by[iso] || [];
      var hot = list.some(function (t) { var k = daysLeft(t.date); return !t.done && k >= 0 && k <= 3; });
      var cls = 'cday' + (d.getMonth() !== m ? ' out' : '') + (iso === today ? ' today' : '') + (iso === UI.sel ? ' sel' : '') + (iso < today ? ' past' : '') + (hot ? ' hot' : '');
      h += '<button type="button" class="' + cls + '" data-act="sel-day" data-date="' + iso + '" aria-label="' + esc(fmtLong(iso) + (list.length ? ', ' + plural(list.length, 'tarea', 'tareas') : '')) + '"' + (iso === UI.sel ? ' aria-pressed="true"' : '') + '>' +
        '<span class="dn">' + d.getDate() + '</span>' +
        '<span class="cdots">' + list.slice(0, 4).map(function (t) { return '<span class="dot" style="--c:var(--t-' + t.type + ')"></span>'; }).join('') + '</span>' +
        '<span class="ctitles">' + list.slice(0, 3).map(function (t) { return '<span class="' + (t.done ? 'done' : '') + '" style="--c:var(--t-' + t.type + ')">' + esc(t.title) + '</span>'; }).join('') + (list.length > 3 ? '<em>+' + (list.length - 3) + ' más</em>' : '') + '</span>' +
        '</button>';
    }
    h += '</div></div>';
    h += '<div class="legend">' + TYPE_ORDER.map(function (k) { return '<span><span class="dot" style="--c:var(--t-' + k + ')"></span>' + TYPES[k].label + '</span>'; }).join('') + '</div>';

    var sel = by[UI.sel] || [];
    var sd = daysLeft(UI.sel);
    h += '<div class="daypanel"><h3>' + fmtLong(UI.sel) + '</h3><div class="sub">' + (sd === 0 ? 'Hoy' : sd > 0 ? (sd === 1 ? 'Mañana' : 'Dentro de ' + sd + ' días') : (sd === -1 ? 'Ayer' : 'Hace ' + (-sd) + ' días')) + ' · ' + (sel.length ? plural(sel.length, 'tarea', 'tareas') : 'nada apuntado') + '</div>' +
      (sel.length ? '<div class="mini-list" style="width:100%">' + sel.map(miniHTML).join('') + '</div>' : '') +
      '<div><button type="button" class="btn" data-act="add-day">' + ICON.plus + 'Añadir para este día</button></div></div>';

    var monthList = S.tasks.filter(function (t) { var d = P.fromISO(t.date); return d.getFullYear() === y && d.getMonth() === m; }).sort(byDate);
    if (monthList.length) {
      h += '<div class="h-sub">Todo ' + MESES[m] + ' (' + monthList.length + ')</div><div class="mini-list" style="width:100%">' + monthList.map(miniHTML).join('') + '</div>';
    }
    $('#calIn').innerHTML = h;
  }

  /* ---------- Render: Ajustes ---------- */
  function renderAjustes() {
    var h = '<div class="h-sec"><h2>Ajustes</h2></div>';
    var perm = CAN_NOTIFY ? Notification.permission : 'unsupported';

    h += '<div class="card"><h3>Avisos</h3><p>Te aviso cuando a una tarea le quede <b>1 semana</b>, cuando le queden <b>3 días</b> y el <b>mismo día</b>.</p>';
    if (CAN_NOTIFY) {
      var st = perm === 'granted' ? ['var(--ok)', 'Avisos del móvil activados'] : perm === 'denied' ? ['var(--urgent)', 'Bloqueados en el navegador: actívalos en los ajustes del móvil'] : ['var(--muted)', 'Avisos del móvil desactivados'];
      h += '<span class="status" style="--c:' + st[0] + '">' + st[1] + '</span>';
      if (IS_IOS && !STANDALONE) h += '<p>En iPhone y iPad, primero instala la app en la pantalla de inicio (hace falta iOS 16.4 o más nuevo) y actívalos desde ahí.</p>';
      if (perm === 'default') h += '<div class="row"><button type="button" class="btn primary" data-act="notif-enable">' + ICON.bell + 'Activar avisos</button></div>';
      if (perm === 'granted') h += '<div class="row"><button type="button" class="btn" data-act="notif-test">Probar un aviso</button></div>';
      h += '<p>Los avisos salen seguro cuando abres la app. Con la app cerrada, Android suele avisar solo; para no perderte nada en ningún móvil, añade las tareas a tu calendario (abajo).</p>';
    } else {
      h += '<p>Aquí los avisos salen al abrir la página. Para que el móvil te avise aunque no la abras, añade cada tarea a tu calendario con el botón <b>Google Calendar</b> que hay dentro de la tarea.</p>';
    }
    h += '</div>';

    var future = S.tasks.filter(function (t) { return !t.done && daysLeft(t.date) >= 0; });
    if (HOSTED) {
      h += '<div class="card"><h3>Calendario del móvil</h3><p>Pasa todas tus tareas pendientes al calendario del iPhone, iPad o Android con alarmas a 7 días, 3 días y el mismo día. Esos avisos llegan siempre, aunque no abras la app.</p>' +
        '<div class="row"><button type="button" class="btn primary" data-act="ics-all"' + (future.length ? '' : ' disabled') + '>' + ICON.cal + 'Añadir ' + plural(future.length, 'tarea', 'tareas') + '</button></div></div>';
    }

    if (HOSTED) {
      h += '<div class="card"><h3>Instalar como app</h3>';
      if (STANDALONE) h += '<span class="status" style="--c:var(--ok)">Ya la estás usando como app</span>';
      else if (UI.installEvt) h += '<p>Tu navegador permite instalarla directamente.</p><div class="row"><button type="button" class="btn primary" data-act="install">Instalar Ordénate</button></div>';
      else h += '<ol><li><b>iPhone / iPad (Safari):</b> toca Compartir y luego «Añadir a pantalla de inicio».</li><li><b>Android (Chrome):</b> menú ⋮ y luego «Instalar app».</li><li><b>Ordenador (Chrome o Edge):</b> icono de instalar en la barra de direcciones.</li></ol>';
      h += '</div>';
    } else {
      h += '<div class="card"><h3>Versión de prueba</h3><p>Estás usando Ordénate dentro de Claude. La versión para instalar en el móvil (con icono y avisos) es la misma app publicada en una web gratuita.</p></div>';
    }

    h += '<div class="card"><label class="switch"><span>Guardar sin preguntar</span><input type="checkbox" id="setAuto" data-set="autoSave"' + (S.settings.autoSave ? ' checked' : '') + '></label>' +
      '<p>Si lo activas, lo que escribas en el chat se guarda directamente, sin tarjeta de confirmación.</p></div>';

    var th = S.settings.theme;
    h += '<div class="card"><h3>Tema</h3><div class="seg" role="group" aria-label="Tema">' +
      [['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Oscuro']].map(function (o) {
        return '<button type="button" data-act="theme" data-theme-val="' + o[0] + '" aria-pressed="' + (th === o[0]) + '">' + o[1] + '</button>';
      }).join('') + '</div></div>';

    var doneN = S.tasks.filter(function (t) { return t.done; }).length;
    h += '<div class="card"><h3>Tus datos</h3><p>' + (Cloud.ref ? 'Tus tareas se guardan en tu cuenta.' : 'Tus tareas se guardan en este dispositivo.') + ' Ahora mismo tienes ' + plural(S.tasks.length, 'tarea', 'tareas') + ' (' + plural(doneN, 'hecha', 'hechas') + ').</p>' +
      '<div class="row"><button type="button" class="btn" data-act="export">Descargar copia</button><button type="button" class="btn" data-act="import">Cargar copia</button></div>' +
      '<input type="file" id="importFile" accept="application/json,.json" hidden>' +
      (UI.wipe ? '<div class="confirm"><p>¿Borrar todas las tareas y el chat? No se puede deshacer.</p><button type="button" class="btn danger solid small" data-act="wipe-yes">Borrar todo</button><button type="button" class="btn small" data-act="wipe-no">Cancelar</button></div>'
        : '<div class="row"><button type="button" class="btn danger" data-act="wipe">Borrar todo</button></div>') +
      '</div>';
    h += '<p class="foot">Ordénate · tu agenda de bolsillo</p>';
    $('#ajustesIn').innerHTML = h;
  }

  /* ---------- Hoja inferior ---------- */
  function openTaskSheet(t, newDate) {
    UI.sheet = {
      kind: 'task', id: t ? t.id : null, confirmDel: false,
      f: t ? { title: t.title, date: t.date, time: t.time, type: t.type, notes: t.notes || '' } : { title: '', date: newDate || todayISO(), time: '', type: 'examen', notes: '' }
    };
    renderSheet();
    if (!t) setTimeout(function () { var i = $('#f-title'); if (i) i.focus(); }, 80);
  }
  function openAlerts(list) { UI.sheet = { kind: 'alerts', list: list }; renderSheet(); }
  function closeSheet() {
    UI.sheet = null;
    $('#sheetWrap').hidden = true;
    if (UI.alertQueue.length) { var q = UI.alertQueue; UI.alertQueue = []; openAlerts(q); }
  }
  function sheetStatus(f) {
    if (!f.date) return '<div class="sheet-status" id="sheetStatus">Elige un día</div>';
    var d = daysLeft(f.date);
    var cls = d === 0 ? ' today' : (d > 0 && d <= 3 ? ' red' : '');
    var where = d < 0 ? 'Ya pasó' : d <= 7 ? 'En Próximas' : 'Entra en Próximas el ' + fmtShort(enterDate(f.date));
    return '<div class="sheet-status' + cls + '" id="sheetStatus"><span>' + leftLabel(d) + '</span><span class="muted">' + where + '</span></div>';
  }
  function renderSheet() {
    var s = UI.sheet; if (!s) return;
    var h = '';
    if (s.kind === 'task') {
      var t = s.id ? findTask(s.id) : null, f = s.f;
      h += '<div class="sheet-head"><h2 id="sheetTitle">' + (t ? 'Tarea' : 'Nueva tarea') + '</h2><button type="button" class="x" data-act="close-sheet" aria-label="Cerrar">' + ICON.x + '</button></div>';
      h += '<label class="sr" for="f-title">Título</label><input class="draft-title" id="f-title" data-sf="title" value="' + esc(f.title) + '" placeholder="Ej: Examen de mates">';
      h += '<div class="field-row"><label class="field">Día<input type="date" id="f-date" data-sf="date" value="' + esc(f.date) + '"></label><label class="field">Hora (opcional)<input type="time" id="f-time" data-sf="time" value="' + esc(f.time) + '"></label></div>';
      h += typePicks(f.type);
      h += '<label class="field">Notas<textarea id="f-notes" data-sf="notes" placeholder="Temas, páginas, material…">' + esc(f.notes) + '</textarea></label>';
      h += sheetStatus(f);
      h += '<div class="sheet-actions"><button type="button" class="btn primary" data-act="sheet-save">' + ICON.check + 'Guardar</button>' +
        (t ? '<button type="button" class="btn" data-act="sheet-done">' + (t.done ? 'Desmarcar' : 'Marcar hecha') + '</button>' : '<button type="button" class="btn" data-act="close-sheet">Cancelar</button>') + '</div>';
      if (t) {
        h += '<div class="export"><h4>Que te avise el móvil</h4><p>Añádela a tu calendario' + (HOSTED ? ' con alarmas a 7 días, 3 días y el mismo día' : '') + '. El calendario te avisa aunque no abras la app.</p><div class="row" style="display:flex;gap:8px;flex-wrap:wrap">' +
          (HOSTED ? '<button type="button" class="btn small" data-act="ics-one" data-id="' + t.id + '">' + ICON.cal + 'iPhone / Outlook</button>' : '') +
          '<a class="btn small" href="' + esc(gcalURL(t)) + '" target="_blank" rel="noopener">' + ICON.ext + 'Google Calendar</a></div></div>';
        h += s.confirmDel
          ? '<div class="confirm"><p>¿Eliminar «' + esc(t.title) + '»?</p><button type="button" class="btn danger solid small" data-act="sheet-del-yes">Eliminar</button><button type="button" class="btn small" data-act="sheet-del-no">No</button></div>'
          : '<button type="button" class="btn danger" data-act="sheet-delete">Eliminar tarea</button>';
      }
    } else if (s.kind === 'alerts') {
      h += '<div class="sheet-head"><h2 id="sheetTitle">Avisos</h2><button type="button" class="x" data-act="close-sheet" aria-label="Cerrar">' + ICON.x + '</button></div><div class="alerts">';
      s.list.forEach(function (a) {
        var t = findTask(a.id); if (!t) return;
        var d = daysLeft(t.date);
        var sub = a.s === 'today' ? (t.time ? 'Hoy a las ' + t.time : 'Es hoy') : a.s === 'three' ? (d === 1 ? 'Es mañana' : 'Faltan ' + d + ' días') + ' · ' + fmtShort(t.date) : (d === 7 ? 'Falta 1 semana' : 'Faltan ' + d + ' días') + ' · ya está en Próximas';
        h += '<button type="button" class="alert ' + a.s + '" data-act="open-task" data-id="' + t.id + '"><span class="aico">' + (d === 0 ? 'HOY' : d) + '</span><span><b>' + esc(t.title) + '</b><span>' + sub + '</span></span></button>';
      });
      h += '</div><div class="sheet-actions"><button type="button" class="btn primary" data-act="alerts-go">Ver Próximas</button><button type="button" class="btn" data-act="close-sheet">Entendido</button></div>';
    }
    $('#sheet').innerHTML = h;
    $('#sheetWrap').hidden = false;
  }

  /* ---------- Toast ---------- */
  function toast(msg, action) {
    var el = $('#toast');
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button" data-act="undo">' + esc(action) + '</button>' : '');
    el.hidden = false;
    clearTimeout(UI.toastT);
    UI.toastT = setTimeout(function () { el.hidden = true; }, 4000);
  }

  /* ---------- Render general ---------- */
  function renderHeader() {
    var d = new Date();
    $('#todayChip').innerHTML = '<b>' + DIAS_C[d.getDay()] + ' ' + d.getDate() + '</b> ' + MESES_C[d.getMonth()];
    var win = S.tasks.filter(function (t) { var k = daysLeft(t.date); return !t.done && k >= 0 && k <= 7; });
    var urg = win.some(function (t) { return daysLeft(t.date) <= 3; });
    ['#badgeTab', '#badgeTop'].forEach(function (sel) {
      var b = $(sel);
      b.hidden = !win.length;
      b.textContent = win.length;
      b.className = 'badge' + (urg ? ' red' : '');
    });
  }
  function renderViews() {
    var wide = isWide();
    var right = UI.view === 'chat' ? 'proximas' : UI.view;
    ['chat', 'proximas', 'calendario', 'ajustes'].forEach(function (v) {
      var on = wide ? (v === 'chat' || v === right) : v === UI.view;
      $('#view-' + v).classList.toggle('active', on);
    });
    $$('#tabbar .tab').forEach(function (b) { if (b.dataset.view === UI.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $$('#toptabs button').forEach(function (b) { if (b.dataset.view === right) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  }
  function renderAll() {
    renderHeader(); renderViews(); renderChat(); renderSuggest(); renderProximas(); renderCal(); renderAjustes();
    if (UI.sheet && UI.sheet.kind === 'alerts') renderSheet();
  }
  function go(v) {
    UI.view = v;
    renderViews();
    if (v === 'chat') { scrollChat(); if (!('ontouchstart' in window)) setTimeout(function () { $('#msgInput').focus(); }, 50); }
    var sc = $('#view-' + (v === 'chat' && isWide() ? 'proximas' : v) + ' .scroll'); if (sc && v !== 'chat') sc.scrollTop = 0;
  }

  /* ---------- Tema ---------- */
  function applyTheme() {
    var th = S.settings.theme, root = document.documentElement;
    if (th === 'light' || th === 'dark') { root.setAttribute('data-theme', th); UI.themeTouched = true; }
    else if (!IN_FRAME || UI.themeTouched) root.removeAttribute('data-theme');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) setTimeout(function () { meta.setAttribute('content', getComputedStyle(document.body).backgroundColor); }, 30);
  }

  /* ---------- Acciones ---------- */
  function draftCtx(el) {
    var box = el.closest('.draft'); if (!box) return null;
    var m = msgById(box.dataset.msg); if (!m) return null;
    var d = null; m.drafts.forEach(function (x) { if (x.id === box.dataset.draft) d = x; });
    return d ? { m: m, d: d, box: box } : null;
  }
  function saveDraft(c, quiet) {
    var d = c.d;
    if (!d.title.trim()) { if (!quiet) { toast('Ponle un título'); var i = c.box.querySelector('[data-f="title"]'); if (i) i.focus(); } return false; }
    if (!d.date) { if (!quiet) toast('Elige el día'); return false; }
    var t = createTask(d);
    d.status = 'saved'; d.taskId = t.id;
    return t;
  }
  function vibrate() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { } }

  var ACT = {
    go: function (el) { go(el.dataset.view); },
    example: function (el) { send(el.dataset.text); },
    fill: function (el) { var i = $('#msgInput'); i.value = el.dataset.text; i.focus(); updateLive(); autoGrow(); },
    'save-draft': function (el) {
      var c = draftCtx(el); if (!c) return;
      var t = saveDraft(c);
      if (!t) return;
      persist(); vibrate();
      renderAll();
      var d = daysLeft(t.date);
      toast(d <= 7 ? 'Guardada · ya está en Próximas' : 'Guardada · entra en Próximas el ' + fmtShort(enterDate(t.date)));
    },
    'discard-draft': function (el) {
      var c = draftCtx(el); if (!c) return;
      c.d.status = 'discarded'; persist(); rerenderMsg(c.m);
    },
    'save-all': function (el) {
      var m = msgById(el.dataset.msg); if (!m) return;
      var n = 0;
      m.drafts.forEach(function (d) { if (d.status === 'draft' && saveDraft({ m: m, d: d, box: document.body }, true)) n++; });
      persist(); vibrate(); renderAll();
      toast(n ? plural(n, 'tarea guardada', 'tareas guardadas') : 'Revisa los títulos y las fechas');
    },
    'pick-type': function (el) {
      var type = el.dataset.type;
      if (el.closest('#sheet') && UI.sheet && UI.sheet.f) {
        UI.sheet.f.type = type;
        $$('#sheet .tpick').forEach(function (b) { b.setAttribute('aria-checked', String(b.dataset.type === type)); });
        return;
      }
      var c = draftCtx(el); if (!c) return;
      c.d.type = type; persist(); rerenderMsg(c.m);
    },
    'ask-chip': function (el) { askResolve(el.dataset.date, el.textContent); },
    'open-task': function (el) { var t = findTask(el.dataset.id); if (t) openTaskSheet(t); },
    'toggle-done': function (el) {
      var t = findTask(el.dataset.id); if (!t) return;
      t.done = !t.done; t.updatedAt = Date.now();
      if (!t.done) armStages(t);
      persist(); vibrate();
      var card = el.closest('.pcard');
      if (card) { card.classList.toggle('done', t.done); el.classList.add('burst'); }
      UI.undo = { kind: 'done', id: t.id };
      if (t.done) toast('¡Hecha!', 'Deshacer');
      setTimeout(renderAll, card ? 450 : 0);
    },
    'toggle-show-done': function () { UI.showDone = !UI.showDone; renderProximas(); },
    'close-sheet': function () { closeSheet(); },
    'sheet-save': function () {
      var s = UI.sheet, f = s.f;
      f.title = $('#f-title').value.trim(); f.date = $('#f-date').value; f.time = $('#f-time').value; f.notes = $('#f-notes').value;
      if (!f.title) { toast('Ponle un título'); $('#f-title').focus(); return; }
      if (!f.date) { toast('Elige el día'); return; }
      var t = s.id ? findTask(s.id) : null;
      if (t) {
        var moved = t.date !== f.date;
        t.title = f.title; t.date = f.date; t.time = f.time; t.type = f.type; t.notes = f.notes; t.updatedAt = Date.now();
        if (moved) armStages(t);
      } else {
        t = createTask(f);
      }
      persist(); vibrate(); closeSheet(); renderAll(); toast(s.id ? 'Cambios guardados' : 'Guardada');
    },
    'sheet-done': function () {
      var t = findTask(UI.sheet.id); if (!t) return;
      t.done = !t.done; t.updatedAt = Date.now(); if (!t.done) armStages(t);
      persist(); vibrate(); closeSheet(); renderAll();
      UI.undo = { kind: 'done', id: t.id };
      toast(t.done ? '¡Hecha!' : 'Vuelve a estar pendiente', 'Deshacer');
    },
    'sheet-delete': function () { UI.sheet.confirmDel = true; renderSheet(); },
    'sheet-del-no': function () { UI.sheet.confirmDel = false; renderSheet(); },
    'sheet-del-yes': function () {
      var id = UI.sheet.id, idx = -1;
      S.tasks.forEach(function (t, i) { if (t.id === id) idx = i; });
      if (idx < 0) return;
      var t = S.tasks.splice(idx, 1)[0];
      UI.undo = { kind: 'del', task: t, idx: idx, notified: S.notified[id] };
      persist(); closeSheet(); renderAll(); toast('Tarea eliminada', 'Deshacer');
    },
    undo: function () {
      var u = UI.undo; if (!u) return;
      if (u.kind === 'del') { S.tasks.splice(u.idx, 0, u.task); S.notified[u.task.id] = u.notified || []; }
      if (u.kind === 'done') { var t = findTask(u.id); if (t) { t.done = !t.done; if (!t.done) armStages(t); } }
      UI.undo = null; persist(); renderAll(); $('#toast').hidden = true;
    },
    'ics-one': function (el) { var t = findTask(el.dataset.id); if (t) openICS([t]); },
    'ics-all': function () {
      var f = S.tasks.filter(function (t) { return !t.done && daysLeft(t.date) >= 0; }).sort(byDate);
      if (f.length) openICS(f);
    },
    'cal-prev': function () { shiftMonth(-1); },
    'cal-next': function () { shiftMonth(1); },
    'cal-today': function () { var d = new Date(); UI.calY = d.getFullYear(); UI.calM = d.getMonth(); UI.sel = todayISO(); renderCal(); },
    'sel-day': function (el) {
      UI.sel = el.dataset.date;
      var d = P.fromISO(UI.sel);
      if (d.getMonth() !== UI.calM) { UI.calY = d.getFullYear(); UI.calM = d.getMonth(); }
      renderCal();
    },
    'add-day': function () { openTaskSheet(null, UI.sel); },
    'alerts-go': function () { closeSheet(); go('proximas'); },
    'notif-enable': function () {
      if (!CAN_NOTIFY) return;
      Notification.requestPermission().then(function (p) {
        renderAjustes();
        if (p === 'granted') { toast('Avisos activados'); registerPeriodic(); }
      });
    },
    'notif-test': function () {
      var opts = { body: 'Así te llegarán los avisos de tus tareas.', icon: 'icons/icon-192.png', tag: 'prueba' };
      if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(function (r) { r.showNotification('Ordénate', opts); });
      else try { new Notification('Ordénate', opts); } catch (e) { toast('Este navegador solo avisa desde la app instalada'); }
    },
    install: function () {
      var e = UI.installEvt; if (!e) return;
      e.prompt();
      e.userChoice.then(function () { UI.installEvt = null; renderProximas(); renderAjustes(); }).catch(function () { });
    },
    'dismiss-install': function () { S.settings.installHint = false; persist(); renderProximas(); },
    theme: function (el) { S.settings.theme = el.dataset.themeVal; persist(); applyTheme(); renderAjustes(); },
    export: function () {
      var data = JSON.stringify({ app: 'ordenate', v: 1, exportedAt: new Date().toISOString(), tasks: S.tasks }, null, 2);
      var name = 'ordenate-copia-' + todayISO() + '.json';
      if (IN_FRAME && window.claude && window.claude.use) {
        window.claude.use('downloads').then(function (dl) {
          if (!dl) { toast('Aquí no se pueden descargar archivos'); return; }
          return dl.save({ filename: name, data: data }).then(function () { toast('Copia descargada'); });
        }).catch(function (e) { if (!e || e.code !== 'declined') toast('No se pudo descargar la copia'); });
        return;
      }
      var url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    },
    import: function () { $('#importFile').click(); },
    wipe: function () { UI.wipe = true; renderAjustes(); },
    'wipe-no': function () { UI.wipe = false; renderAjustes(); },
    'wipe-yes': function () {
      var keep = S.settings; S = blank(); S.settings = keep; UI.wipe = false; UI.seen = {};
      addMsg({ from: 'bot', kind: 'welcome' });
      persist(); renderAll(); toast('Todo borrado');
    }
  };

  function shiftMonth(k) {
    var d = new Date(UI.calY, UI.calM + k, 1, 12);
    UI.calY = d.getFullYear(); UI.calM = d.getMonth();
    renderCal();
  }

  function autoGrow() { var ta = $('#msgInput'); ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; }

  function registerPeriodic() {
    if (!HOSTED || !('serviceWorker' in navigator)) return;
    navigator.serviceWorker.ready.then(function (reg) {
      if (!reg.periodicSync || !navigator.permissions) return;
      return navigator.permissions.query({ name: 'periodic-background-sync' }).then(function (st) {
        if (st.state === 'granted') return reg.periodicSync.register('ordenate-check', { minInterval: 6 * 3600 * 1000 });
      });
    }).catch(function () { });
  }

  /* ---------- Eventos ---------- */
  function bind() {
    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el) return;
      var fn = ACT[el.dataset.act];
      if (fn) { e.preventDefault(); fn(el, e); }
    });
    document.addEventListener('input', function (e) {
      var el = e.target;
      if (el.id === 'msgInput') { autoGrow(); updateLive(); return; }
      if (el.dataset.f) {
        var c = draftCtx(el); if (!c) return;
        c.d[el.dataset.f] = el.value;
        return;
      }
      if (el.dataset.sf && UI.sheet && UI.sheet.f) {
        UI.sheet.f[el.dataset.sf] = el.value;
        if (el.dataset.sf === 'date') { var st = $('#sheetStatus'); if (st) st.outerHTML = sheetStatus(UI.sheet.f); }
      }
    });
    document.addEventListener('change', function (e) {
      var el = e.target;
      if (el.dataset.ask && el.value) { askResolve(el.value, 'El ' + fmtLong(el.value)); return; }
      if (el.dataset.f) {
        var c = draftCtx(el); if (!c) return;
        c.d[el.dataset.f] = el.value; persist();
        if (el.dataset.f !== 'title') rerenderMsg(c.m);
        return;
      }
      if (el.dataset.set) { S.settings[el.dataset.set] = el.checked; persist(); toast(el.checked ? 'Se guardará sin preguntar' : 'Te enseñaré una tarjeta antes de guardar'); return; }
      if (el.id === 'importFile' && el.files && el.files[0]) {
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var o = JSON.parse(fr.result);
            var incoming = sanitize({ tasks: o.tasks || (o.state && o.state.tasks) || [] }).tasks;
            var n = 0;
            incoming.forEach(function (t) { if (!findTask(t.id)) { S.tasks.push(t); armStages(t); n++; } });
            persist(); renderAll(); toast(n ? plural(n, 'tarea cargada', 'tareas cargadas') : 'No había tareas nuevas en la copia');
          } catch (err) { toast('Ese archivo no es una copia de Ordénate'); }
          el.value = '';
        };
        fr.readAsText(el.files[0]);
      }
    });
    $('#composer').addEventListener('submit', function (e) {
      e.preventDefault();
      var ta = $('#msgInput'); var v = ta.value;
      ta.value = ''; autoGrow(); updateLive();
      send(v);
    });
    $('#msgInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#composer').requestSubmit ? $('#composer').requestSubmit() : $('#composer').dispatchEvent(new Event('submit', { cancelable: true })); }
    });
    $('#msgInput').addEventListener('focus', function () { if (!isWide() && ('ontouchstart' in window)) document.body.classList.add('typing'); });
    $('#msgInput').addEventListener('blur', function () { setTimeout(function () { document.body.classList.remove('typing'); }, 120); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && UI.sheet) closeSheet();
      if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('draft-title')) { e.preventDefault(); e.target.blur(); }
    });
    // deslizar para cambiar de mes
    var sx = 0, sy = 0;
    document.addEventListener('touchstart', function (e) { if (e.target.closest('#calGrid')) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (sx == null) return;
      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dy) < 45) shiftMonth(dx < 0 ? 1 : -1);
      sx = null;
    }, { passive: true });

    if (window.matchMedia) {
      var mq = matchMedia('(min-width: 860px)');
      (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(renderViews);
    }
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); UI.installEvt = e; renderProximas(); renderAjustes(); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
    setInterval(tick, 30000);
  }

  function tick() {
    var t = todayISO();
    if (t !== UI.day) { UI.day = t; renderAll(); }
    checkAlerts();
  }

  /* ---------- Arranque ---------- */
  function start() {
    if (!S.messages.length) addMsg({ from: 'bot', kind: 'welcome' });
    var upcoming = S.tasks.some(function (t) { var d = daysLeft(t.date); return !t.done && d >= 0 && d <= 7; });
    UI.view = upcoming ? 'proximas' : 'chat';
    applyTheme();
    bind();
    renderAll();
    scrollChat();
    Cloud.init();

    if (HOSTED && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function () { if (CAN_NOTIFY && Notification.permission === 'granted') registerPeriodic(); }).catch(function () { });
      idbGet('swNotified').then(function (m) {
        if (m && typeof m === 'object') {
          Object.keys(m).forEach(function (id) {
            var cur = S.notified[id] || [];
            (m[id] || []).forEach(function (s) { if (cur.indexOf(s) === -1) cur.push(s); });
            S.notified[id] = cur;
          });
        }
        setTimeout(checkAlerts, 600);
      });
    } else {
      setTimeout(checkAlerts, 600);
    }
  }

  start();
})();

</script>
</body>
</html>
